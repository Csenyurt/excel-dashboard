services:
  excel-dashboard:
    build: .
    pull_policy: build
    container_name: excel-dashboard
    restart: unless-stopped
    environment:
      - PORT=3000
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - excel-dashboard-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.excel-dashboard.rule=Host(`dashboard.cengizhansenyurt.cloud`)
      - traefik.http.routers.excel-dashboard.entrypoints=websecure
      - traefik.http.routers.excel-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.excel-dashboard.loadbalancer.server.port=3000

volumes:
  excel-dashboard-data:
