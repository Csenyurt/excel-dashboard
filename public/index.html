<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#060d1f; --bg2:#0a1630; --panel:rgba(18,34,70,.55); --panel-b:rgba(120,160,230,.18);
  --gold:#f2d68a; --gold2:#c9a24a; --neon:#5fb8f0; --text:#eaf0fa; --muted:#8fa2c4; --line:rgba(120,160,230,.12);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
#sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(1200px 700px at 85% -10%,rgba(95,184,240,.16),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(201,162,74,.14),transparent 60%),
  linear-gradient(160deg,#060d1f 0%,#0a1630 55%,#050a18 100%)}
canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.app{position:relative;z-index:1;display:grid;grid-template-columns:270px 1fr;height:100vh}
/* Sidebar */
aside{padding:22px 16px;display:flex;flex-direction:column;gap:6px;background:rgba(6,13,31,.55);backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#f2d68a,#9c7a2e);color:#1a1405;font-size:22px;box-shadow:0 0 22px rgba(242,214,138,.35)}
.brand b{display:block;font-size:16px;letter-spacing:.4px}
.brand small{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.navlbl{font-size:10px;letter-spacing:2px;color:#5d7096;text-transform:uppercase;padding:10px 12px 6px}
.tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#b5c3dc;cursor:pointer;font-size:14px;border:1px solid transparent;transition:.25s;position:relative}
.tab i{font-size:20px;color:#7f93b8;transition:.25s}
.tab:hover{background:rgba(95,184,240,.07);color:#fff}
.tab:hover i{color:var(--neon)}
.tab.on{background:linear-gradient(90deg,rgba(242,214,138,.14),rgba(242,214,138,.02));border-color:rgba(242,214,138,.35);color:var(--gold)}
.tab.on i{color:var(--gold);filter:drop-shadow(0 0 6px rgba(242,214,138,.6))}
.tab.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-b);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.foot-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid transparent;background:none;color:#8fa2c4;font-size:17px;cursor:pointer;text-decoration:none}
.foot-btn+.foot-btn{margin-left:2px}
.foot-btn:hover{color:var(--gold);border-color:rgba(242,214,138,.3)}
.foot-btn.spin i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:8px;height:8px;border-radius:50%;background:#5dcaa5;box-shadow:0 0 10px #5dcaa5}
/* Main */
main{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 34px;border-bottom:1px solid var(--line)}
header h1{font-size:24px;font-weight:600;letter-spacing:.3px}
header p{color:var(--muted);font-size:13px;margin-top:3px}
.clockbox{display:flex;align-items:center;gap:16px;padding:8px 18px 8px 8px;border-radius:40px;background:var(--panel);border:1px solid var(--panel-b);backdrop-filter:blur(10px)}
.digital b{display:block;font-size:24px;font-weight:600;color:var(--gold);letter-spacing:1px;font-variant-numeric:tabular-nums}
.digital small{color:var(--muted);font-size:11px}
.content{flex:1;overflow:auto;padding:30px 34px}
.stage{min-height:100%;border-radius:22px;border:1px solid var(--panel-b);background:var(--panel);backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.06),transparent 30%)}
.empty{text-align:center;max-width:460px;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.empty .ic{width:88px;height:88px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:42px;color:var(--gold);
  background:radial-gradient(circle at 30% 30%,rgba(242,214,138,.25),rgba(242,214,138,.04));border:1px solid rgba(242,214,138,.3);box-shadow:0 0 40px rgba(242,214,138,.15)}
.empty h2{font-size:22px;font-weight:600;margin-bottom:10px}
.empty p{color:var(--muted);font-size:14px;line-height:1.7}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:12px;padding:6px 14px;border-radius:20px;color:var(--neon);border:1px solid rgba(95,184,240,.35);background:rgba(95,184,240,.08)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Components */
.stage.filled{display:block;align-items:initial;justify-content:initial;padding:26px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;position:relative;z-index:1}
.panel{background:rgba(6,16,36,.45);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:200px}
.ph{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:600;font-size:15px;margin-bottom:16px}
.ph i{font-size:19px}
.badge-n{margin-left:auto;font-size:12px;color:var(--neon);border:1px solid rgba(95,184,240,.35);border-radius:12px;padding:2px 10px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:280px;border:1.5px dashed rgba(120,160,230,.35);border-radius:16px;cursor:pointer;transition:.25s;text-align:center;color:var(--muted);font-size:13px}
.drop b{color:var(--text);font-size:16px;font-weight:600}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(242,214,138,.05)}
.drop-ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:30px;color:var(--gold);background:rgba(242,214,138,.1);border:1px solid rgba(242,214,138,.3);margin-bottom:8px}
.row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.filechip{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 12px;border-radius:10px;background:rgba(95,184,240,.08);border:1px solid rgba(95,184,240,.3);color:var(--neon)}
.grid3{display:grid;grid-template-columns:2fr 1.3fr .8fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.fld input,.fld select,.coltable select{height:40px;border-radius:10px;border:1px solid rgba(120,160,230,.25);background:rgba(6,16,36,.75);color:var(--text);padding:0 12px;font-size:14px;outline:none;font-family:inherit}
.fld input:focus,.fld select:focus,.coltable select:focus{border-color:var(--gold2)}
.hint{margin:16px 0 10px;font-size:13px;color:var(--neon);display:flex;gap:6px;align-items:center}
.coltable{border:1px solid var(--line);border-radius:12px;max-height:380px;overflow:auto}
.coltable .ch,.coltable .cr{display:grid;grid-template-columns:minmax(0,1.5fr) 1fr 1fr;gap:10px;align-items:center;padding:8px 14px}
.coltable .ch{position:sticky;top:0;background:#0d1b3a;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7f93b8;z-index:1}
.coltable .cr{border-top:1px solid var(--line)}
.coltable .cn{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coltable select{height:34px;font-size:13px}
.legend{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
.legend b{color:#b5c3dc;font-weight:600}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 18px;border-radius:11px;border:1px solid rgba(120,160,230,.3);background:transparent;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{border-color:var(--neon)}
.btn.gold{border:0;color:#1a1405;font-weight:600;background:linear-gradient(145deg,#f2d68a,#c9a24a);box-shadow:0 8px 22px rgba(201,162,74,.25)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{height:34px;font-size:13px;color:var(--muted)}
.msg{font-size:13px}.msg.err{color:#f09595}.msg.ok{color:#5dcaa5}
.tpllist{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tplcard{padding:14px;border-radius:14px;background:rgba(18,34,70,.55);border:1px solid var(--panel-b);animation:rise .4s ease}
.tc-top{display:flex;justify-content:space-between;align-items:center}
.tc-top b{font-size:15px}
.tc-meta{font-size:12px;color:var(--muted);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:3px 9px;border-radius:8px;background:rgba(127,147,184,.12);color:#b5c3dc}
.chip.r-k{background:rgba(95,184,240,.12);color:#8fd0f7}.chip.r-o{background:rgba(242,214,138,.12);color:#f2d68a}
.chip.r-z{background:rgba(93,202,165,.12);color:#7fdcbc}.chip.r-h{background:rgba(240,149,149,.12);color:#f5b0b0}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.icon-btn:hover{color:#f09595;border-color:rgba(240,149,149,.3)}.icon-btn.warn{color:#f09595;border-color:#f09595}
.empty-small{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:30px 10px}
.empty-small i{font-size:28px;color:#5d7096}
@media(max-width:1100px){.split{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
/* Veri page */
.v-row{display:flex;gap:12px}
.v-sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:#5dcaa5;border-color:rgba(93,202,165,.35)}.pill.warn{color:#f2c46a;border-color:rgba(242,196,106,.35)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:rgba(6,16,36,.5);border:1px solid var(--panel-b);animation:rise .5s ease both}
.kpi>i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:var(--gold);background:rgba(242,214,138,.1)}
.kpi span{display:block;font-size:12px;color:var(--muted)}.kpi b{font-size:21px;font-weight:600;letter-spacing:.3px}
.kpi b.up{color:#5dcaa5}.kpi b.mid{color:#f2c46a}.kpi b.down{color:#f09595}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ccard{background:rgba(6,16,36,.5);border:1px solid var(--panel-b);border-radius:18px;padding:16px 16px 8px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:border-color .25s}
.ccard:hover{border-color:rgba(242,214,138,.35)}
.ccard.wide{grid-column:1/-1}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-h b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}.cc-h b i{color:var(--gold);font-size:18px}
.cc-h small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.cc-tools{display:flex;gap:2px}.cc-tools .icon-btn:disabled{opacity:.45;cursor:default}
.cc-tools .icon-btn:not(:disabled):hover{color:var(--gold);border-color:rgba(242,214,138,.3)}
.cc-body{height:320px;margin-top:6px}
.ccard.wide .cc-body{height:380px}
@media(max-width:1100px){.cgrid{grid-template-columns:1fr}}
/* Style drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:380px;max-width:92vw;z-index:50;display:flex;flex-direction:column;background:rgba(8,18,40,.96);backdrop-filter:blur(18px);border-left:1px solid rgba(242,214,138,.25);box-shadow:-30px 0 80px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.dr-head b{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:16px}.dr-head small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.dr-body{flex:1;overflow:auto;padding:6px 20px 20px}
.dr-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.dr-sec h4{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#7f93b8;font-weight:600;margin-bottom:10px}
.dr-r{display:grid;grid-template-columns:1fr 120px 46px;align-items:center;gap:8px;font-size:13px;color:#c9d4e8;margin:7px 0}
.dr-r input{accent-color:#f2d68a;width:100%}.dr-r b{font-weight:500;color:var(--gold);font-size:12px;text-align:right}
.dr-t{display:flex;align-items:center;gap:10px;font-size:13px;color:#c9d4e8;margin:9px 0;cursor:pointer}
.dr-t input{display:none}.dr-t i{width:34px;height:20px;border-radius:12px;background:rgba(127,147,184,.3);position:relative;transition:.2s;flex:none}
.dr-t i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#eaf0fa;transition:.2s}
.dr-t input:checked+i{background:linear-gradient(145deg,#f2d68a,#c9a24a)}.dr-t input:checked+i::after{left:17px;background:#1a1405}
.dr-f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}
.dr-f input,.dr-f select{height:36px;border-radius:9px;border:1px solid rgba(120,160,230,.25);background:rgba(6,16,36,.75);color:var(--text);padding:0 10px;font-size:13px;outline:none;font-family:inherit}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg span{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid rgba(120,160,230,.25);color:#b5c3dc;cursor:pointer}
.seg span.on{border-color:#c9a24a;color:var(--gold);background:rgba(242,214,138,.1)}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.pal{display:flex;flex-direction:column;gap:5px;padding:7px;border-radius:10px;border:1px solid rgba(120,160,230,.2);background:none;cursor:pointer;color:#b5c3dc;font-size:10.5px;font-family:inherit}
.pal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal::before{content:none}.pal i{display:inline-block;width:25%;height:14px}.pal i:first-child{border-radius:4px 0 0 4px}.pal i:nth-child(4){border-radius:0 4px 4px 0}
.pal{flex-direction:row;flex-wrap:wrap;column-gap:0}.pal span{width:100%;text-align:left}
.pal.on{border-color:#c9a24a;background:rgba(242,214,138,.08);color:var(--gold)}
.dr-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.dr-foot .msg{flex:1 1 100%;text-align:right}
.ccard.editing{border-color:rgba(242,214,138,.7);box-shadow:0 0 0 1px rgba(242,214,138,.3),0 0 40px rgba(242,214,138,.12)}
.cc-tools .gear:not(:disabled){color:#b5c3dc}
.cc-foot{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:#7f93b8;border-top:1px solid var(--line);padding:9px 2px 6px;margin-top:4px;line-height:1.5}
.cc-foot i{font-size:14px;margin-top:1px}
.dlmenu{position:fixed;z-index:60;width:300px;padding:6px;border-radius:14px;background:rgba(6,16,36,.98);border:1px solid rgba(242,214,138,.35);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .2s ease}
.dlmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:9px;background:none;color:#c9d4e8;font-size:13px;text-align:left;cursor:pointer;font-family:inherit}
.dlmenu button i{font-size:20px;color:var(--gold)}.dlmenu button small{display:block;color:#7f93b8;font-size:11px}
.dlmenu button:hover:not(:disabled){background:rgba(242,214,138,.08);color:var(--gold)}.dlmenu button:disabled{opacity:.45;cursor:default}
.dlmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}.dl-msg{font-size:12px;color:#5dcaa5;padding:4px 12px;min-height:18px}
.cc-tools .dl:not(:disabled){color:#b5c3dc}
/* Tablet / narrow */
@media(max-width:900px){
  .app{grid-template-columns:76px 1fr}
  .brand div,.tab span,.navlbl,.side-foot span{display:none}
  .tab{justify-content:center;padding:14px}
  .tab.on::before{left:-16px}
  .side-foot{justify-content:center}
  header{padding:16px 20px}.content{padding:20px}
  .digital small{display:none}
}
</style>
</head>
<body>
<div id="sky"></div><canvas id="stars"></canvas>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><i class="ti ti-chart-arcs"></i></div><div><b>Excel Dashboard</b><small>Komuta merkezi</small></div></div>
    <div class="navlbl">Veri</div>
    <div class="tab on" data-id="sablon"><i class="ti ti-file-spreadsheet"></i><span>Şablon Excel giriş</span></div>
    <div class="tab" data-id="veri"><i class="ti ti-table-import"></i><span>Veri dolu Excel giriş</span></div>
    <div class="tab" data-id="nielsen"><i class="ti ti-chart-dots-3"></i><span>Nielsen giriş</span></div>
    <div class="navlbl">Araçlar</div>
    <div class="tab" data-id="sihirbaz"><i class="ti ti-wand"></i><span>Grafik sihirbazı</span></div>
    <div class="tab" data-id="radyo"><i class="ti ti-radio"></i><span>Canlı radyo</span></div>
    <div class="tab" data-id="haber"><i class="ti ti-news"></i><span>Haber kanalı</span></div>
    <div class="tab" data-id="tema"><i class="ti ti-palette"></i><span>Tema ve renk</span></div>
    <div class="side-foot"><div class="dot" id="sysdot"></div><span id="ver">Sistem çalışıyor</span>
      <button class="foot-btn" id="upd" title="Güncellemeleri al"><i class="ti ti-refresh"></i></button>
      <a class="foot-btn" href="/logout" title="Çıkış yap"><i class="ti ti-logout"></i></a></div>
  </aside>
  <main>
    <header>
      <div><h1 id="title">Şablon Excel giriş</h1><p id="desc"></p></div>
      <div class="clockbox">
        <svg id="analog" width="52" height="52" viewBox="0 0 100 100"></svg>
        <div class="digital"><b id="time">--:--:--</b><small id="date"></small></div>
      </div>
    </header>
    <div class="content"><div class="stage" id="stage"></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="/js/sablon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="/js/stil.js"></script>
<script src="/vendor/pptxgen.bundle.js"></script>
<script src="/js/export.js"></script>
<script src="/js/pptx.js"></script>
<script src="/js/veri.js"></script>
<script>
const RENDER={sablon:r=>renderSablon(r),veri:r=>renderVeri(r)};
const TABS={
  sablon:{t:"Şablon Excel giriş",d:"Boş şablonları yükle, sütunları tanıt ve kaydet",i:"ti-file-spreadsheet",s:2},
  veri:{t:"Veri dolu Excel giriş",d:"Dolu dosyayı yükle, 12 hazır grafik otomatik oluşsun",i:"ti-table-import",s:2},
  nielsen:{t:"Nielsen giriş",d:"Aylık Nielsen dosyasından HARIBO analizleri",i:"ti-chart-dots-3",s:4},
  sihirbaz:{t:"Grafik sihirbazı",d:"Adım adım, sıfırdan grafik oluştur",i:"ti-wand",s:5},
  radyo:{t:"Canlı radyo",d:"Türk radyoları ve dünya haritasından ülke radyoları",i:"ti-radio",s:6},
  haber:{t:"Haber kanalı",d:"Canlı yayın, son dakika ve piyasalar",i:"ti-news",s:6},
  tema:{t:"Tema ve renk",d:"22 tema ve renk düzenleyici",i:"ti-palette",s:7}
};
function show(id){
  const x=TABS[id];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  document.getElementById('title').textContent=x.t;
  document.getElementById('desc').textContent=x.d;
  const st=document.getElementById('stage');
  if(typeof RENDER!=="undefined"&&RENDER[id]){st.className='stage filled';RENDER[id](st);try{localStorage.setItem('tab',id)}catch(_){};return;}
  st.className='stage';st.innerHTML='<div class="empty" id="empty"></div>';
  const e=document.getElementById('empty');
  e.innerHTML=`<div class="ic"><i class="ti ${x.i}"></i></div><h2>${x.t}</h2><p>${x.d}.<br>Bu bölüm yapım planının ${x.s}. adımında burada açılacak.</p><span class="badge"><i class="ti ti-hourglass"></i> Yakında</span>`;
  e.style.animation='none';void e.offsetWidth;e.style.animation='';
  try{localStorage.setItem('tab',id)}catch(_){}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.id));
let start='sablon';try{start=localStorage.getItem('tab')||start}catch(_){}
show(TABS[start]?start:'sablon');

/* Clock: analog + digital */
const A=document.getElementById('analog');
let face='<circle cx="50" cy="50" r="46" fill="rgba(10,22,48,.9)" stroke="#c9a24a" stroke-width="2"/>';
for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r1=i%3?38:34;face+=`<line x1="${50+r1*Math.sin(a)}" y1="${50-r1*Math.cos(a)}" x2="${50+42*Math.sin(a)}" y2="${50-42*Math.cos(a)}" stroke="${i%3?'#5d7096':'#f2d68a'}" stroke-width="${i%3?2:3}" stroke-linecap="round"/>`;}
face+='<line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="#eaf0fa" stroke-width="4" stroke-linecap="round"/><line id="mm" x1="50" y1="50" x2="50" y2="18" stroke="#eaf0fa" stroke-width="3" stroke-linecap="round"/><line id="ss" x1="50" y1="56" x2="50" y2="14" stroke="#5fb8f0" stroke-width="1.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#f2d68a"/>';
A.innerHTML=face;
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  document.getElementById('hh').setAttribute('transform',`rotate(${(h%12)*30+m*.5} 50 50)`);
  document.getElementById('mm').setAttribute('transform',`rotate(${m*6+s*.1} 50 50)`);
  document.getElementById('ss').setAttribute('transform',`rotate(${s*6} 50 50)`);
  document.getElementById('time').textContent=n.toLocaleTimeString('tr-TR');
  document.getElementById('date').textContent=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tick();setInterval(tick,1000);


/* Version + self-update */
const verEl=document.getElementById('ver'),updBtn=document.getElementById('upd');
let startedAt=null;
fetch('/api/version').then(r=>r.json()).then(v=>{startedAt=v.started;verEl.textContent='Sürüm '+v.version;}).catch(()=>{});
updBtn.onclick=async()=>{
  if(updBtn.classList.contains('spin'))return;
  updBtn.classList.add('spin');verEl.textContent='Güncelleniyor…';document.getElementById('sysdot').style.background='#f2d68a';
  try{await fetch('/api/update',{method:'POST'});}catch(_){}
  const t0=Date.now();
  const poll=async()=>{
    try{const v=await (await fetch('/api/version',{cache:'no-store'})).json();
      if(v.started!==startedAt){verEl.textContent='Güncellendi ✓';setTimeout(()=>location.reload(),600);return;}}catch(_){}
    if(Date.now()-t0>120000){verEl.textContent='Zaman aşımı, sayfayı yenile';updBtn.classList.remove('spin');return;}
    setTimeout(poll,2000);
  };
  setTimeout(poll,2500);
};

/* Soft starfield */
const c=document.getElementById('stars'),x=c.getContext('2d');let S=[];
function size(){c.width=innerWidth;c.height=innerHeight;S=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,p:Math.random()*6.28}));}
function draw(t){x.clearRect(0,0,c.width,c.height);for(const s of S){x.globalAlpha=.35+.35*Math.sin(t/1400+s.p);x.fillStyle='#cfe2ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}requestAnimationFrame(draw);}
addEventListener('resize',size);size();requestAnimationFrame(draw);
</script>
