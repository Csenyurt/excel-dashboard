<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Excel Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#eaf0fa;
  background:radial-gradient(900px 600px at 80% 0%,rgba(95,184,240,.18),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(201,162,74,.16),transparent 60%),linear-gradient(160deg,#060d1f,#0a1630 55%,#050a18)}
.card{width:min(380px,92vw);padding:38px 34px;border-radius:22px;background:rgba(18,34,70,.55);border:1px solid rgba(120,160,230,.18);backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;font-size:32px;color:#1a1405;background:linear-gradient(145deg,#f2d68a,#9c7a2e);box-shadow:0 0 30px rgba(242,214,138,.35)}
h1{font-size:20px;font-weight:600}
p{color:#8fa2c4;font-size:13px;margin:6px 0 26px}
.field{position:relative}
.field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7f93b8;font-size:18px}
input{width:100%;height:48px;padding:0 14px 0 42px;border-radius:12px;border:1px solid rgba(120,160,230,.25);background:rgba(6,16,36,.7);color:#eaf0fa;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#c9a24a;box-shadow:0 0 0 3px rgba(242,214,138,.15)}
button{margin-top:16px;width:100%;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:600;color:#1a1405;cursor:pointer;background:linear-gradient(145deg,#f2d68a,#c9a24a);box-shadow:0 8px 24px rgba(201,162,74,.3);transition:.2s}
button:hover{filter:brightness(1.08)}
.err{color:#f09595;font-size:13px;margin-top:14px;min-height:18px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<form class="card" method="POST" action="/login">
  <div class="logo"><i class="ti ti-chart-arcs"></i></div>
  <h1>Excel Dashboard</h1>
  <p>Devam etmek için şifreni gir</p>
  <div class="field"><i class="ti ti-lock"></i><input type="password" name="password" placeholder="Şifre" autofocus required></div>
  <button type="submit">Giriş yap</button>
  <div class="err">__ERROR__</div>
</form>
</body>
</html>
